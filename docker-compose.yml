# Brings up both services:
#   FastAPI  -> http://localhost:8000  (docs at /docs)
#   Streamlit-> http://localhost:8501
# Usage:  docker compose up --build -d
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: moex-eda-api
    container_name: moex-eda-api
    environment:
      - MOEX_ROOT=/app
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: moex-eda-streamlit
    container_name: moex-eda-streamlit
    environment:
      - MOEX_ROOT=/app
    ports:
      - "8501:8501"
    restart: unless-stopped
